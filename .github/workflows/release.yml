name: release

# Packages through the shared release workflows of Open-Mixer/.github. A tag v<version> builds signed
# RPMs (Fedora 44, x86_64 and aarch64) and DEBs (Debian bookworm and trixie, amd64 and arm64),
# publishes them to the OpenMixer channel and attaches them to the GitHub release. A dispatched run
# (workflow_dispatch) is a dry run: it builds and lints everything and publishes nothing.
#
# Either way, the core's packages the run built are then installed in clean containers of every
# release and architecture, and a consumer is built against the development package
# (tests/package-check.sh). The DigiNet module's packages need libdiginet 0.1.10 or later and the
# Mackie module's libmackie 0.1.0 or later, which the build takes from the OpenMixer channel
# (channel-deps), and the shared workflows install them against that channel.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

jobs:
  rpm:
    uses: Open-Mixer/.github/.github/workflows/build-rpm.yml@openmixer-v1
    with:
      package-name: libsurface
      binary-names: libsurface libsurface-devel libsurface-diginet libsurface-diginet-devel libsurface-mackie libsurface-mackie-devel surface-c24
      publish: ${{ github.ref_type == 'tag' }}
      needs-mod-host: false
      # libdiginet-devel with the desk mux, for the DigiNet module
      channel-deps: true
    secrets: inherit

  # or skipped RPM job skips this one, so no DEB is published after a failed RPM.
  # beside the RPMs: the two publish jobs share one concurrency group, so their pushes never race
  deb:
    uses: Open-Mixer/.github/.github/workflows/build-deb.yml@openmixer-v1
    with:
      package-name: libsurface
      binary-names: libsurface0 libsurface-dev libsurface-diginet0 libsurface-diginet-dev libsurface-mackie0 libsurface-mackie-dev surface-c24
      publish: ${{ github.ref_type == 'tag' }}
      dependencies: ''
      requires: 'libdiginet-transport0 libmackie0'
      # libdiginet-dev with the desk mux, for the DigiNet module
      channel-deps: true
    secrets: inherit
  # the cells the RPMs are installed in: check-matrix's answer (rule 11-10: fc45 beside fc44;
  # the quick set while a release wave is open, the whole matrix declared here otherwise)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44", "45"]'
          rpm-arches: '["x86_64", "aarch64"]'


  install-rpm:
    name: Install check (${{ matrix.cell.image }}, ${{ matrix.cell.arch }})
    needs: [checks, rpm]
    if: needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    container: ${{ matrix.cell.image }}
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libsurface-rpms-fc${{ matrix.cell.fedora }}-${{ matrix.cell.arch }}
          path: pkgs
      - name: Install in a clean fedora, build a consumer
        run: sh tests/package-check.sh pkgs

  install-deb:
    name: Install check (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: deb
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    container: debian:${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: libsurface-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: pkgs
      # the shared workflow uploads each suite's .debs under a directory named after the suite
      - name: Install in a clean debian, build a consumer
        run: sh tests/package-check.sh pkgs/${{ matrix.suite }}
