name: fuzz
# The libFuzzer harnesses of fuzz/ (fuzz/README.md), on a v* tag and on workflow_dispatch: each built
# with clang under AddressSanitizer and UndefinedBehaviorSanitizer and fuzzed for 60 s from its
# seed corpus; every patch of fuzz/sabotage/ found at the property it names; every check's own
# mutant record met, at that check, on its seed; the coverage witness held to its floor, with
# every check reached; the corpus what fuzz-corpus writes; and each harness linked fully static
# and run over its corpus. An input that crashes a harness is uploaded as the fuzz-findings
# artifact. make test stays in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the cells the harnesses run: check-matrix's answer (rule 11-10: fc45 beside fc44;
  # the quick set while a release wave is open, the whole matrix declared here otherwise)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44", "45"]'
          rpm-arches: '["x86_64"]'

  fuzz:
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    name: fuzz the pure helpers, the board shadow, the bank, the motor policy and the key table (${{ matrix.cell.image }})
    runs-on: ubuntu-latest
    # A backstop: fuzz-run spends 60 s on each of five harnesses, and fuzz-sabotage and
    # fuzz-records run seeds only.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container: ${{ matrix.cell.image }}
    steps:
      - name: clang, libFuzzer, llvm-cov and the static libc
        run: |
          dnf -y install --setopt=install_weak_deps=False --setopt=retries=10 clang compiler-rt llvm \
            gcc make gawk git diffutils glibc-static binutils
      - uses: actions/checkout@v4
      # fuzz-sabotage and fuzz-records change the tree and put it back with git
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the harnesses (clang, libFuzzer, ASan, UBSan)
        run: make fuzz
      - name: The seed corpus is what fuzz-corpus writes
        run: make fuzz-corpus-check
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      # a property no breakage can make fail checks nothing: each patch must make its harness
      # abort on the seed it names, in the property it names
      - name: Find every sabotage patch, each in its own property
        run: make fuzz-sabotage
      # every check records the one-line bug it catches and the seed it catches it on, and each
      # record, alone, makes that check abort on that seed; a check with neither a record nor a
      # not-a-property line is red
      - name: Meet every check's record
        run: make fuzz-records
      # the seed corpus must keep reaching the reader lines it reaches today and every check
      - name: Hold the coverage floor
        run: make fuzz-coverage
      - name: Each harness linked fully static, over its corpus
        run: make fuzz-static
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz/findings/
          if-no-files-found: ignore
